# Fail a pull request when a commit message (base..head) or the pull
# request description contains a Claude/Anthropic co-author trailer or a
# "Generated with Claude Code" / "Generated with [Claude Code]" line.

name: no-claude-coauthor

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  no-claude-coauthor:
    name: no-claude-coauthor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject Claude and Anthropic attribution lines
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          export GIT_PAGER=cat

          BASE_SHA="${BASE_SHA:-}"
          HEAD_SHA="${HEAD_SHA:-}"
          BASE_REF="${BASE_REF:-}"
          PR_BODY="${PR_BODY:-}"

          is_sha() {
            [[ "$1" =~ ^[0-9a-fA-F]{40}$ || "$1" =~ ^[0-9a-fA-F]{64}$ ]]
          }

          if ! is_sha "$BASE_SHA" || ! is_sha "$HEAD_SHA"; then
            echo "BASE_SHA and HEAD_SHA must be commit SHAs from the pull request event."
            exit 1
          fi

          # Case-insensitive. A line is forbidden when:
          #   - it contains "Co-authored-by:" and, after that, "claude" or "anthropic"
          #   - it contains "Generated with Claude Code" or "Generated with [Claude Code]"
          line_is_forbidden() {
            local line="${1%$'\r'}"
            local lower="${line,,}"
            local compact="${lower//[\[\]]/}"

            if [[ "$compact" =~ (^|[^[:alnum:]])generated[[:space:]]+with[[:space:]]+claude[[:space:]]+code([^[:alnum:]]|$) ]]; then
              return 0
            fi
            if [[ "$lower" =~ co-authored-by:.*(claude|anthropic) ]]; then
              return 0
            fi
            return 1
          }

          if ! git cat-file -e "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            printf 'Cannot find base commit %s. Checkout must use fetch-depth: 0.\n' "$BASE_SHA"
            exit 1
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" >/dev/null 2>&1; then
            printf 'Cannot find head commit %s. Checkout must use fetch-depth: 0.\n' "$HEAD_SHA"
            exit 1
          fi

          if ! rev_list="$(git --no-pager rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")"; then
            echo "git rev-list failed."
            exit 1
          fi

          hits=0
          commit_hits=0
          body_hits=0
          count=0
          report=""

          while IFS= read -r sha || [[ -n "${sha:-}" ]]; do
            [[ -z "${sha:-}" ]] && continue
            if ! is_sha "$sha"; then
              printf 'Unexpected commit id from git rev-list: %s\n' "$sha"
              exit 1
            fi
            count=$((count + 1))
            subject="$(git --no-pager log -1 --format=%s "$sha")"
            msg="$(git --no-pager log -1 --format=%B "$sha")"
            commit_printed=0
            while IFS= read -r line || [[ -n "${line:-}" ]]; do
              if line_is_forbidden "$line"; then
                if [[ "$commit_printed" -eq 0 ]]; then
                  report+=$'\n'
                  report+="Commit ${sha}"
                  report+=$'\n'
                  report+="Subject: ${subject}"
                  commit_printed=1
                  commit_hits=1
                  hits=1
                fi
                report+=$'\n  '
                report+="${line}"
              fi
            done <<< "$msg"
          done <<< "$rev_list"

          if [[ -n "$PR_BODY" ]]; then
            body_printed=0
            while IFS= read -r line || [[ -n "${line:-}" ]]; do
              if line_is_forbidden "$line"; then
                if [[ "$body_printed" -eq 0 ]]; then
                  report+=$'\n'
                  report+="Pull request description:"
                  body_printed=1
                  body_hits=1
                  hits=1
                fi
                report+=$'\n  '
                report+="${line}"
              fi
            done <<< "$PR_BODY"
          fi

          if [[ "$hits" -eq 0 ]]; then
            printf 'No forbidden attribution lines in %s commit(s) (%s..%s) or the pull request description.\n' \
              "$count" "$BASE_SHA" "$HEAD_SHA"
            exit 0
          fi

          echo "::error::Claude or Anthropic attribution line found in a commit message or the pull request description"
          echo "Forbidden attribution lines:"
          printf '%s\n' "$report"
          printf '\n'
          echo "How to fix:"
          if [[ "$commit_hits" -eq 1 ]]; then
            echo "  Reword each flagged commit so the matching lines are gone from branch history, then force-push."
            echo "  A follow-up commit leaves a flagged commit in base..head, so the check stays red until those commits are rewritten."
            if [[ -n "$BASE_REF" ]]; then
              printf '    git rebase -i origin/%s\n' "$BASE_REF"
            else
              echo "    git rebase -i origin/<base-branch>"
            fi
            echo "    # mark each flagged commit as reword, delete the matching lines, and save"
            echo "    git push --force-with-lease"
          fi
          if [[ "$body_hits" -eq 1 ]]; then
            echo "  Edit the pull request description and delete the matching lines."
          fi
          exit 1
